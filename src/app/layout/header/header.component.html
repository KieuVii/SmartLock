<mat-toolbar class="app-toolbar">
  <button mat-icon-button (click)="onMenuClick()" aria-label="Chuyển menu">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="page-title">{{ pageTitle() }}</span>

  <span class="spacer"></span>

  <div class="toolbar-actions">
    <button
      mat-icon-button
      [matMenuTriggerFor]="alertsMenu"
      aria-label="Thông báo"
      [matBadge]="newAlertsCount()"
      matBadgeColor="warn"
      [matBadgeHidden]="newAlertsCount() === 0"
    >
      <mat-icon>notifications</mat-icon>
    </button>
    <mat-menu #alertsMenu="matMenu" class="alerts-menu">
      <div class="menu-header">
        <span>Thông báo</span>
        @if (newAlertsCount() > 0) {
          <span class="menu-header-count">{{ newAlertsCount() }} mới</span>
        }
      </div>
      @for (alert of recentAlerts(); track alert.id) {
        <button mat-menu-item routerLink="/alert-page">
          <span class="alert-dot" [class]="'severity-' + alert.severity"></span>
          <span class="alert-text">
            <span class="alert-title">{{ alert.title }}</span>
            <span class="alert-time">{{ formatDate(alert.created_at) }}</span>
          </span>
        </button>
      } @empty {
        <div class="menu-empty">Không có thông báo</div>
      }
      <button mat-menu-item routerLink="/alert-page">
        <mat-icon>chevron_right</mat-icon>
        <span>Xem tất cả cảnh báo</span>
      </button>
    </mat-menu>

    <button
      class="avatar-button"
      [matMenuTriggerFor]="userMenu"
      aria-label="Menu tài khoản"
      matRipple
    >
      <span class="avatar">{{ userInitials() }}</span>
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="user-header">
        <span class="avatar avatar-lg">{{ userInitials() }}</span>
        <span class="user-email">{{ user()?.email ?? 'Đã đăng xuất' }}</span>
      </div>
      <button mat-menu-item (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        <span>Đăng xuất</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
